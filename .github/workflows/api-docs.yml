name: deploy-api-docs
on:
  push:
    branches:
      - main
permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
     if: github.repository == 'vapor/postgres-nio'
     uses: vapor/api-docs/.github/workflows/deploy.yml@main
     secrets: inherit
     with:
       package: postgres-nio
